name: NYRA Broadcast — Maggie's paddock notes & interviews

on:
  schedule:
    # 03:10 UTC = 11:10pm America/New_York during EDT (10:10pm during EST) —
    # well after the day's "America's Day at the Races" broadcast has aired
    # and its VOD has posted to the channel's streams tab. Only one new
    # broadcast exists per day, so (unlike the twice-daily Kentucky HBPA
    # pipeline) once daily is enough.
    - cron: "10 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: nyra-broadcast-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    # Moved off GitHub's shared runners 2026-10-24 — those runners' IPs got
    # permanently bot-walled by YouTube ("Sign in to confirm you're not a
    # bot") starting 2026-10-20, even with valid cookies; the same code
    # works from this home Mac's IP. See the self-hosted runner set up on
    # this machine (custom label `youtube-mac`, registered under this
    # repo's Settings → Actions → Runners) — that one custom label already
    # uniquely identifies this runner, so the OS label (actually `OSX` for
    # this runner version, not `macOS`) is deliberately left out of the
    # match here to avoid a label-name trap. Everything else about this
    # workflow (schedule, secrets, state commit) is unchanged.
    runs-on: [self-hosted, youtube-mac]
    # Much longer than the other two pipelines' 90 min — this downloads and
    # transcribes a 4.5-6 hour broadcast (vs. short clips/PDFs), confirmed
    # locally to take a real while just to download the audio alone.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: automation/nyra-broadcast-quotes
    steps:
      - uses: actions/checkout@v4

      # NOT actions/setup-python here, deliberately — confirmed real
      # 2026-10-24: GitHub's official darwin Python build has `/Users/runner`
      # baked into it from the hosted-runner machine it was built on, and its
      # install script tries to mkdir that exact path regardless of
      # RUNNER_TOOL_CACHE — fails with "Permission denied" on any self-hosted
      # Mac whose account isn't literally named "runner". This Mac's own
      # python3 (no version pin needed — requirements.txt has none) avoids
      # the whole problem.
      - name: Ensure python3 is installed
        run: command -v python3 >/dev/null 2>&1 || brew install python3

      # macOS, not Ubuntu — apt-get doesn't exist here. ffmpeg is already
      # installed on this runner's Mac directly (not via brew inside the
      # job), so this is just a safety net for a future re-registration on
      # a fresh machine.
      - name: Ensure ffmpeg is installed
        run: command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      # yt-dlp needs a JS runtime to solve YouTube's "n" signature challenge
      # and resolve playable format URLs — confirmed real 2026-10-16 (GitHub's
      # bare runner has none, so every download failed with "n challenge
      # solving failed... The page needs to be reloaded" even with valid
      # cookies). Deno is the runtime yt-dlp's own warning names.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --break-system-packages: this Mac's Homebrew python3 is PEP
      # 668-protected ("externally-managed-environment") — confirmed real
      # 2026-10-24. Safe here: this runner only ever runs these pipelines,
      # so there's no other project's dependencies on this system Python to
      # collide with.
      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt

      # Kept as an optional fallback, not required — confirmed 2026-10-24
      # that this self-hosted runner's home IP doesn't need cookies at all
      # for captions (the bot wall only ever hit GitHub's shared runner
      # IPs). Still written in case a future broadcast needs the full
      # audio-download path instead of captions; continue-on-error so a
      # missing/empty secret never fails the job — config.py's
      # ytdlp_auth_args() only passes --cookies when this file actually
      # exists, so this step not running (or running on nothing) is a
      # no-op, not a break.
      - name: Write YouTube cookies (optional fallback, not required)
        continue-on-error: true
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > "$RUNNER_TEMP/youtube_cookies.txt"

      - name: Run the pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YTDLP_COOKIES_PATH: ${{ runner.temp }}/youtube_cookies.txt
        run: python3 run.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed_video_ids.json state/dropped_quotes.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "NYRA Broadcast quote pipeline: update processed-video state [skip ci]"
          # Retry on push rejection — see kentucky-hbpa.yml's identical step
          # for the full reasoning: a plain `git pull --rebase` fails
          # outright (confirmed real 2026-10-24) when both sides append new
          # ids to the end of the same JSON array, since that's a textual
          # conflict git can't auto-resolve even though the actual merge
          # rule is trivial ("union of two id lists"). Merging by id/key in
          # Python instead means both sides' new entries always survive.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected — merging state by id/key instead of rebasing, attempt $i"
            git fetch origin main
            python3 merge_state_on_conflict.py
            # --mixed (NOT --soft) — confirmed real bug 2026-10-26: --soft
            # only moves HEAD, it never touches the index, so the index
            # still held this job's OWN stale base commit (whatever main was
            # when this run's trigger first fired, possibly hours earlier if
            # it sat queued waiting for the runner). The re-commit below
            # then inherited that stale tree for every file except the two
            # explicitly re-added here, silently reverting unrelated same-day
            # pushes (wiped out a same-day Worker change this way once
            # already). --mixed actually resets the index to origin/main's
            # tree first, so only the two explicitly re-added files differ
            # from the real latest main.
            git reset --mixed origin/main
            git add state/processed_video_ids.json state/dropped_quotes.json
            git commit -m "NYRA Broadcast quote pipeline: update processed-video state [skip ci]"
            sleep 2
          done
          exit 1
