name: Keeneland Barn Notes — quote import

on:
  schedule:
    # 3x a day, 6 hours apart: 11:05, 17:05, 23:05 UTC = 7:05am, 1:05pm,
    # 7:05pm Eastern during EDT (6:05am, 12:05pm, 6:05pm during EST; GitHub
    # cron is UTC-only). A run with nothing new exits in seconds.
    - cron: "5 11,17,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be saved without writing anything"
        type: boolean
        default: true
      only_pdf:
        description: "Process just this PDF URL (optional)"
        type: string
        default: ""

concurrency:
  group: keeneland-barn-notes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: automation/keeneland-barn-notes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdftotext
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          ONLY_PDF: ${{ inputs.only_pdf }}
        run: python run.py

      - name: Commit updated state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed_pdfs.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Keeneland Barn Notes: update processed PDFs [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
