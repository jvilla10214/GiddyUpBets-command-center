name: Kentucky HBPA — trainer/jockey quote extraction

on:
  schedule:
    # 16:00 and 01:00 UTC = 12:00pm and 9:00pm America/New_York during EDT
    # (11:00am/8:00pm during EST) — fixed UTC time, no DST adjustment, same
    # convention as the Steve Byk and Barn Notes pipelines' schedules.
    - cron: "0 16 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: kentucky-hbpa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: automation/kentucky-hbpa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # YouTube bot-walls GitHub's shared runner IPs ("Sign in to confirm
      # you're not a bot") — confirmed real 2026-10-16. Real cookies from a
      # logged-in session (a separate account, not tied to anything the user
      # cares about) are the fix; written to $RUNNER_TEMP, outside the repo
      # checkout, so there's no chance of it ending up committed.
      - name: Write YouTube cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > "$RUNNER_TEMP/youtube_cookies.txt"

      - name: Run the pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YTDLP_COOKIES_PATH: ${{ runner.temp }}/youtube_cookies.txt
        run: python run.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/processed_video_ids.json state/dropped_quotes.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Kentucky HBPA quote pipeline: update processed-video state [skip ci]"
          # Retry with rebase — this repo has had same-day commits land from
          # other concurrent pipelines/sessions, and a bare push would just
          # fail outright if main moved in between (confirmed real, not
          # theoretical, the day this workflow was built).
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
